name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Type-check backend ───────────────────────────────────────────────────
  type-check-backend:
    name: Type-check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run type-check

  # ─── Build backend ────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: type-check-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ─── Type-check frontend ──────────────────────────────────────────────────
  type-check-frontend:
    name: Type-check Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check

  # ─── Build frontend ───────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: type-check-frontend
    defaults:
      run:
        working-directory: frontend
    env:
      # Set this secret in GitHub: Settings → Secrets → NEXT_PUBLIC_API_URL
      # Value should be: https://your-backend.onrender.com/api
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ─── Deploy notes ─────────────────────────────────────────────────────────
  # Backend → Render.com auto-deploys on push to main via GitHub integration
  #           (set up at https://dashboard.render.com → Connect GitHub repo)
  #
  # Frontend → Vercel auto-deploys on push to main via GitHub integration
  #            (set up at https://vercel.com → Import Git Repository)
  #            Remember to set NEXT_PUBLIC_API_URL in Vercel dashboard too!
